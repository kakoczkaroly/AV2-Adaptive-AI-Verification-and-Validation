<path stroke="#7e8fa0" stroke-dasharray="4 5" d="M791 206V251"/>
<path stroke="#16867a" d="M1030 316V407Q1030 427 1010 427H178Q159 427 159 408V311"/>
</g>
<g stroke="#9eb5c9" fill="#fff"><rect x="151" y="143" width="146" height="53" rx="6"/><rect x="337" y="143" width="146" height="53" rx="6"/><rect x="527" y="143" width="146" height="53" rx="6"/><rect x="718" y="143" width="146" height="53" rx="6"/><rect x="915" y="143" width="146" height="53" rx="6"/></g>
<g stroke="#91c4bc" fill="#e9f5f2"><rect x="151" y="260" width="146" height="55" rx="6"/><rect x="337" y="260" width="146" height="55" rx="6"/><rect x="527" y="260" width="146" height="55" rx="6"/><rect x="718" y="260" width="146" height="55" rx="6"/><rect x="915" y="260" width="146" height="55" rx="6"/></g>
<g font-size="15" font-weight="700" text-anchor="middle"><text x="224" y="174">Propose change</text><text x="410" y="174">Emit Change Unit</text><text x="600" y="174">Build R1, R2…</text><text x="791" y="174">Bind candidate</text><text x="988" y="174">Bounded rollout</text>
<text x="224" y="283">Verify signal</text><text x="224" y="303">Challenge &amp; block</text><text x="410" y="283">Review contract</text><text x="410" y="303">Pin test examples</text><text x="600" y="283">Check each delta</text><text x="600" y="303">Validate behaviour</text><text x="791" y="283">Verify freshness</text><text x="791" y="303">Validate integration</text><text x="988" y="283">Check telemetry</text><text x="988" y="303">Validate outcomes</text></g>
<rect x="289" y="210" width="470" height="27" rx="13" fill="#dce8f2"/><text x="305" y="229" font-size="13" font-weight="700">Unit B can enter discovery while Unit A is still being verified</text>
<text x="634" y="348" font-size="14" fill="#8e4f28">Finding → exact revision → focused retest</text>
<text x="720" y="369" font-size="13" fill="#435a6c">Only current evidence + valid mandate permits exposure.</text>
<rect x="310" y="411" width="477" height="31" rx="15" fill="#e2f2ef"/><text x="548" y="432" text-anchor="middle" font-size="14" font-weight="750" fill="#086d62">Monitoring starts new discovery, not a new release</text>
<text x="32" y="474" font-size="13" fill="#435a6c">Verification: meets the rule.  /  Validation: fits the real need.  /  Both begin before code.</text>
</g><g aria-hidden="true" fill="none" pointer-events="none">
