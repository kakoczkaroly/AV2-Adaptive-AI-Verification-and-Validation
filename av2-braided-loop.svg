<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="493" viewBox="0 0 1152 493" role="img" aria-labelledby="t d">
<title id="t">AV² v0.2: independent QA runs while change is being made</title>
<desc id="d">Two concurrent lanes run from observations through incremental changes. QA tests each available revision, returns findings directly to the affected artifact, and qualifies only current evidence before exposure. Monitoring starts new discovery without stopping ongoing work.</desc>
<defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="4"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<rect width="1152" height="493" fill="#f7f9fb"/>
<g font-family="system-ui, sans-serif" fill="#15273c">
<text x="30" y="48" font-size="33" font-weight="750">AV² / Concurrent assurance</text>
<text x="32" y="77" font-size="16" fill="#435a6c">v0.2 · Two lanes, overlapping units, evidence at each revision</text>
<text x="32" y="135" font-size="15" font-weight="750" fill="#335f87">DELIVERY</text>
<text x="32" y="263" font-size="14" font-weight="750" fill="#086d62">INDEPENDENT<tspan x="32" dy="18">QA</tspan></text>
<g font-size="14" fill="#526475" text-anchor="middle"><text x="224" y="114">DISCOVERY</text><text x="410" y="114">PARTITION</text><text x="600" y="114">WORKING DELTAS</text><text x="791" y="114">CANDIDATE</text><text x="988" y="114">LIVE</text></g>
<g fill="none" stroke-width="2" marker-end="url(#arrow)">
<path stroke="#466d94" d="M145 169H1095"/><path stroke="#16867a" d="M145 288H1095"/>
